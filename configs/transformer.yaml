data:
  output_dir: artifacts/strict
train:
  dataset_dir: artifacts/strict
  output_dir: runs/transformer
  seed: 13
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  device: auto
model:
  model_type: transformer
  embedding_type: code_pool
  word2vec_path:
  freeze_embeddings: false
  code_embedding_dim: 128
  visit_dim: 128
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1
  transformer_heads: 4
  transformer_ff_dim: 256
