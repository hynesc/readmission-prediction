data:
  output_dir: artifacts/strict
train:
  dataset_dir: artifacts/strict
  output_dir: runs/content_original
  seed: 13
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  device: auto
model:
  model_type: content_original
  embedding_type: multi_hot
